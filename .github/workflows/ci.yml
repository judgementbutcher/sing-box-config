name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.lock
      - run: python scripts/quality/check_public_repo.py
      - name: Run tests with isolated artifacts
        shell: powershell
        run: .\scripts\quality\test.ps1

  windows-integration:
    runs-on: windows-latest
    env:
      SING_BOX_REQUIRE_TEST_CORES: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - name: Prepare pinned validation and isolated routing cores
        shell: powershell
        run: .\scripts\quality\prepare-ci-cores.ps1
      - name: Run Windows entry points and isolated routing integration
        shell: powershell
        run: .\scripts\quality\test.ps1 -PytestArgs @('tests/test_manage_windows.py', 'tests/test_scripts_windows.py', 'tests/test_policy_contract.py', 'tests/test_rule_sets.py', 'tests/test_quality_scripts.py')
