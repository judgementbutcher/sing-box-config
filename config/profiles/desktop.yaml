schema_version: 1
platform: windows
embed_local_rule_sets: true
strip_rule_set_initial_path: true

config:
  inbounds:
    - type: tun
      tag: tun-in
      address:
        - 172.18.0.1/30
        - fdfe:dcba:9876::1/126
      auto_route: true
      strict_route: true
      # 不写 mtu / udp_timeout / stack。reF1nd 1.15 内置栈未指定 mtu 时，
      # 非安卓平台用 65535，UDP 映射默认 5 分钟；stack 已弃用，1.17 删除。
      # 旧的 1400 是 system 栈防分片的取值，会把新栈的吞吐压低。
      dns_mode: hijack
    - type: mixed
      tag: mixed-in
      listen: 127.0.0.1
      listen_port: 7890
route_rules:
  - process_name:
      - WinStore.App.exe
      - MicrosoftStore.exe
      - StoreExperienceHost.exe
    action: route
    outbound: Available
  - rule_set: microsoft-store
    action: route
    outbound: Available

rule_sets:
  - tag: microsoft-store
    type: local
    format: source
    path: config/rule-sets/microsoft-store.json
