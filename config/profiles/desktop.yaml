schema_version: 1
platform: windows
# auto_detect_interface 在内核拨号时防止回环，不再由生成器解析节点并写死 /32 路由。
resolve_node_ipv4: false
embed_local_rule_sets: true
strip_rule_set_initial_path: true

config:
  inbounds:
    - type: tun
      tag: tun-in
      address:
        - 172.18.0.1/30
        - fdfe:dcba:9876::1/126
      auto_route: true
      strict_route: true
      udp_timeout: 5m
      mtu: 1400
      # 不写 stack：sing-box 1.15 起 TUN 默认使用 sing-tun 自带的 TCP/IP 栈，
      # 峰值吞吐、能耗与内存都优于 system/gvisor/mixed；stack 选项已弃用，
      # 1.17 删除。生成器审计会拒绝再次写入 stack。
      dns_mode: hijack
    - type: mixed
      tag: mixed-in
      listen: 127.0.0.1
      listen_port: 7890
route_rules:
  - process_name:
      - WinStore.App.exe
      - MicrosoftStore.exe
      - StoreExperienceHost.exe
    action: route
    outbound: Available
  - rule_set: microsoft-store
    action: route
    outbound: Available

dns_rules:
  - rule_set: microsoft-store
    action: route
    server: google

rule_sets:
  - tag: microsoft-store
    type: local
    format: source
    path: config/rule-sets/microsoft-store.json
