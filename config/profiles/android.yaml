schema_version: 1
platform: android
strip_rule_set_initial_path: true

config:
  inbounds:
    - type: tun
      tag: tun-in
      # 仅声明 IPv4 地址是有意取舍：全局 IPv6 不进 TUN，ip_version: 6 的
      # reject 规则在安卓上不会命中（保留它只为与桌面规则保持一致）。
      # ipv4_only 的 DNS 策略下应用几乎拿不到 IPv6 目标，硬编码 IPv6
      # 字面量的流量会绕过代理直接出物理网卡（暴露面很小）；换取的是
      # 挂 VPN 时手机仍能访问 IPv6 资源。如需与桌面一致（IPv6 进入
      # TUN 后被拒绝），在下方追加 fdfe:dcba:9876::1/126 即可。
      address: [172.18.0.1/30]
      auto_route: true
      # 局域网地址不进入 TUN。手机开着 VPN 时，SFA 自己拉取发布链接、以及
      # 其他 App 访问局域网设备，都属于“到本地网络”的连接：一旦被 TUN 接管，
      # 就要依赖 route.rules 里 ip_is_private→direct 的判断，配置稍旧或规则
      # 顺序变化就会把请求送进代理，表现为 SFA 拉取时报 EOF/连接重置。
      # 在路由层面排除掉，这类连接根本不经过 sing-box，最彻底。
      # 不能把整个 172.16.0.0/12 排除：TUN 地址 172.18.0.1/30 和
      # dns_mode=hijack 的 DNS 对端 172.18.0.2 都在里面。下面是
      # 172.16.0.0/12 去掉 172.18.0.0/30 之后的网段，家用或公司的
      # 172.16 网段因此也不进 TUN。
      # IPv6 的 ULA、链路本地和 IPv4 链路本地地址同样属于本地网络。
      route_exclude_address:
        - 10.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/15
        - 172.18.0.4/30
        - 172.18.0.8/29
        - 172.18.0.16/28
        - 172.18.0.32/27
        - 172.18.0.64/26
        - 172.18.0.128/25
        - 172.18.1.0/24
        - 172.18.2.0/23
        - 172.18.4.0/22
        - 172.18.8.0/21
        - 172.18.16.0/20
        - 172.18.32.0/19
        - 172.18.64.0/18
        - 172.18.128.0/17
        - 172.19.0.0/16
        - 172.20.0.0/14
        - 172.24.0.0/13
        - 192.168.0.0/16
        - fc00::/7
        - fe80::/10
      # 不写 mtu / udp_timeout / stack。reF1nd 1.15 在安卓上把缺省 MTU
      # 定为 9000（65535 会在部分机型上报 ENOBUFS），UDP 映射默认 5 分钟。
      # 旧的 1360 是 system 栈防分片的取值，会把新栈的吞吐压低；把 UDP
      # 超时改成 1 分钟会拆掉空闲的 QUIC 会话。stack 已弃用，1.17 删除。
      dns_mode: hijack
      # 1.15 起 auto_redirect 在 Android 上完整可用，但需要 root（SFA 的
      # root 服务或 root shell），非 root 设备启用会导致启动失败，故默认不开。
      # 已 root 的设备可取消下一行注释，获得更好的路由性能与热点转发支持。
      # auto_redirect: true
route_rules:
  - package_name:
      - com.android.vending
      - com.google.android.gms
      - com.google.android.gsf
    action: route
    outbound: Google Play
  - rule_set: google-play
    action: route
    outbound: Google Play

rule_sets:
  - tag: google-play
    type: inline
    inline_file: config/rule-sets/google-play.json
