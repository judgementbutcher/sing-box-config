schema_version: 1

subscription:
  cache_max_age: 3d
  timeout_seconds: 20
  retry_proxy: http://127.0.0.1:7890

# Provider 能力保留给需要运行时更新的订阅；当前本地订阅显式使用 provider:false，
# 静态展开节点并保留原始名称，避免 Provider 的 provider-tag/ 前缀污染客户端面板。
# 将来单独订阅设置 provider:true 后，生成器才会为它启用运行时 Provider。
providers:
  enabled: true
  update_interval: 24h
  health_check:
    enabled: false
    url: https://www.gstatic.com/generate_204
    interval: 10m
    timeout: 3s

# 节点 server 域名的解析器：必须是不经过 TUN/代理的直连 DNS。
# 节点域名若走 dns.final（google → detour Available），会依赖当前选中节点，
# 当前节点不稳时测速就超时（忽隐忽现）。domain_resolver 直连解析后与代理解耦。
node_dns_resolver:
  server: domestic
  timeout: 2s

# DoH 解析器模板。每项展开为 443 端口、/dns-query 路径、启用 TLS 的 https
# 服务器；同一组内的解析器在每次查询时并行竞速（evaluate ×N → respond
# NOERROR ×N → respond NXDOMAIN ×N → SERVFAIL），timeout 是单路上限。
#
# server 一律写 IP，避免"解析器自己需要被解析"的自举问题。
#
# domestic 不写 detour：DNS 服务器不带 detour 时本身就等价于一个空直连
# outbound，显式写 detour: direct 反而会被核心拒绝（"detour to an empty
# direct outbound makes no sense"，check 不报错、启动时才 FATAL）。
# 也不能用 type: local：桌面 TUN 的 dns_mode=hijack 会把系统 DNS 指向 TUN
# 自身，local 解析器会递归查询 sing-box 自己并静默超时；strict_route 的 WFP
# 过滤器还会拦截非 TUN 接口上的 53 端口，所以直连 DNS 一律走 443 上的 DoH。
#
# proxy 按 proxy_detours 为每个出口各展开一组，tag 为 <tag>-<后缀>，空后缀
# 即 google/cloudflare 本身。解析出口必须与连接出口一致：googlevideo.com、
# ttvnw.net 等按解析器出口所在地分配 CDN 边缘，解析走 Available、播放走单独
# 挑的节点时边缘与出口不在一地，取流会绕远。路由规则交给某个出口时，DNS
# 自动使用该出口的解析器；出口不在此列表中时使用 Available 的解析器。
dns_upstreams:
  timeout: 2s
  domestic:
    - {tag: domestic, server: 223.5.5.5, server_name: dns.alidns.com}
    - {tag: domestic-backup, server: 1.12.12.12, server_name: doh.pub}
  proxy:
    - {tag: google, server: 8.8.8.8, server_name: dns.google}
    - {tag: cloudflare, server: 1.1.1.1, server_name: cloudflare-dns.com}
  proxy_detours:
    Available: ""
    AI: ai
    YouTube: youtube
    Twitch: twitch

config:
  experimental:
    cache_file:
      enabled: true
      # 1.14 起 DNS 缓存需要显式启用持久化；否则 cache_file 只保存规则集
      # 等核心状态，重启后节点域名解析仍会从头开始。
      store_dns: true
      # 1.15 的缓存写缓冲定期落盘，降低移动端频繁写盘开销。
      flush_interval: 1m
    # reF1nd performs a second URLTest request so connection setup cost does
    # not dominate the reported delay.
    urltest_unified_delay: true
  log:
    disabled: false
    level: warn
    timestamp: true
  dns:
    # 正常情况下 final 不可达：生成器会把 final 展开成无条件的竞速块放在
    # DNS 规则末尾，以 SERVFAIL 收尾。保留 final 只是规则改坏时的安全网。
    final: google
    strategy: ipv4_only
    reverse_mapping: true
    # 单次查询最多等待 3 秒；所有竞速块均在 2 秒内结束。
    timeout: 3s
    # reF1nd：缓存时把过短的 TTL 抬到 60 秒。每次缓存未命中都要经代理发起
    # 两路 DoH 竞速，CDN 常见的 10–30 秒 TTL 会让同一域名反复查询；60 秒内
    # 地址变化对代理与直连都无影响。
    min_cache_ttl: 60
  http_clients:
    # 规则集通过代理下载，域名也用代理侧解析：国内解析器给出的是面向国内的
    # CDN 边缘，经由海外出口回连会绕远甚至失败。
    - tag: rule-set-downloader
      detour: Available
      domain_resolver: google
  route:
    auto_detect_interface: true
    default_http_client: rule-set-downloader
    default_domain_resolver:
      server: domestic
      timeout: 2s
    final: Available

selectors:
  available: Available
  ai: AI
  direct: direct
  # AI 分组地区白名单：ai: auto 只把命中这些地区的节点放进 AI 组
  # （ai: true 也只放宽 insecure 限制，地区门槛不变）。只收录 Claude/
  # ChatGPT 等官方支持的地区；香港/大陆被上游封锁，未识别地区（Others）
  # 不会进入，写错地区名等于收不进节点。
  # 列表顺序即优先级：分组默认选中第一个地区（美国）里最靠前的节点，
  # 其余地区仅作备用；组内同一地区的节点保持订阅原序。
  ai_regions: [US, JP, SG, TW]
  interrupt_exist_connections: true
  # 业务分组：成员为 Available 及其全部条目，默认跟随 Available，需要时
  # 可在面板里单独挑节点而不影响其他流量。
  # direct: last 在成员末尾追加 direct；direct: default 把 direct 放在首位
  # 并作为默认。when_referenced: true 的分组只在 profile 规则引用时生成。
  groups:
    - {tag: Emby, direct: last}
    - {tag: YouTube}
    # Spotify 账号地区校验看出口 IP，机房段会被判成"资料与所在地区不符"
    # 而拒绝播放，所以默认直连，代理节点仍可在面板里切换。
    - {tag: Spotify, direct: default}
    # Telegram/Twitch/Google Play 只走代理，流量不能悄悄退回直连。
    - {tag: Telegram}
    - {tag: Twitch}
    - {tag: Google Play, when_referenced: true}

rule_sets:
  - tag: china-direct
    type: local
    format: source
    path: config/rule-sets/china-direct.json
  - tag: ai-domains
    type: local
    format: source
    path: config/rule-sets/ai-domains.json
  - tag: emby-domains
    type: local
    format: source
    path: config/rule-sets/emby-domains.json
  - tag: direct-cdn
    type: local
    format: source
    path: config/rule-sets/direct-cdn.json
  - tag: spotify-direct
    type: local
    format: source
    path: config/rule-sets/spotify-direct.json
  - tag: geosite-cn
    type: remote
    format: binary
    url: https://fastly.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-cn.srs
    update_interval: 1d
    http_client: rule-set-downloader
    initial_path: runtime/rule-set-cache/geosite-cn.srs
  - tag: geoip-cn
    type: remote
    format: binary
    url: https://fastly.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/geoip-cn.srs
    update_interval: 1d
    http_client: rule-set-downloader
    initial_path: runtime/rule-set-cache/geoip-cn.srs
  - tag:
      - geosite-geolocation-!cn
      - geosite-anthropic
      - geosite-openai
      - geosite-telegram
      - geosite-twitch
      - geosite-category-ads-all
    type: remote
    format: binary
    url: https://fastly.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/{tag}.srs
    update_interval: 1d
    http_client: rule-set-downloader
    initial_path: runtime/rule-set-cache/{tag}.srs

# 路由规则按顺序匹配，越靠前优先级越高。含域名匹配（domain*/rule_set）的
# 规则会自动生成同序的 DNS 规则：route 使用该出口的解析器（direct →
# domestic），reject 返回 NXDOMAIN。规则上写 dns: <解析器> 覆盖，写
# dns: false 不生成 DNS 规则。相邻且解析器相同的规则会合并成一个竞速块，
# 所以同解析器的规则尽量排在一起。
route:
  pre_rules:
    - port: 53
      action: hijack-dns
    - action: sniff
      timeout: 300ms
    - protocol: dns
      action: hijack-dns
    # Never route packets addressed to the TUN itself back into direct.
    # The DNS peer is handled by hijack-dns above; other ports must be dropped.
    - ip_cidr: [172.18.0.0/30, 'fdfe:dcba:9876::/126']
      action: reject
      method: drop
    - ip_is_private: true
      action: route
      outbound: direct
    - ip_version: 6
      action: reject
    - protocol: [bittorrent]
      action: route
      outbound: direct
  business_rules:
    # YouTube 视频链路：播放地址与取流请求的出口 IP 绑定，这些域名必须落在
    # 同一个出口，否则分到两个节点就会 403。googlevideo.com 承载实际视频流，
    # youtubei.googleapis.com 是取流接口，yt3/yt4.ggpht.com 是头像与封面。
    # 必须排在下面的通用 Google 规则之前，否则会被那条规则先摘走。
    - domain_suffix:
        - youtube.com
        - youtu.be
        - yt.be
        - youtube-nocookie.com
        - youtubekids.com
        - ytimg.com
        - googlevideo.com
        - youtubei.googleapis.com
        - youtube.googleapis.com
        - yt3.ggpht.com
        - yt4.ggpht.com
      action: route
      outbound: YouTube
    # Twitch 直播取流对节点质量敏感（twitch.tv、ttvnw.net、jtvnw.net 等），
    # 必须排在 geosite-geolocation-!cn 之前，否则会被通用海外规则先摘走。
    - rule_set: [geosite-twitch]
      action: route
      outbound: Twitch
    # AI 走 AI 分组（只含 selectors.ai_regions 白名单地区的节点）。
    # geosite-anthropic 覆盖 claude.com/claude.dev/clau.de/claudemcp* 等
    # 新域名，若漏到 geosite-geolocation-!cn 会从 Available（默认香港节点）
    # 出站，触发 Anthropic 的地区封锁。ai-domains 里的
    # generativelanguage.googleapis.com 等同时命中通用 Google 后缀，
    # 所以也必须排在通用 Google 规则之前。
    - rule_set: [geosite-anthropic, geosite-openai, ai-domains]
      action: route
      outbound: AI
    - rule_set: [emby-domains]
      action: route
      outbound: Emby
    # Telegram clients use both domain names and bare data-centre IPs.
    # Keep the domain path explicit so DNS and routing agree with the IP rule
    # below, including when an app has not yet connected to a data centre.
    - rule_set: [geosite-telegram]
      action: route
      outbound: Telegram
    # Google services frequently split requests across these CDN/API domains.
    # Keep them on the proxy path instead of letting the domestic fallback win.
    - domain_suffix:
        - gstatic.com
        - googleapis.com
        - googleusercontent.com
        - ggpht.com
      action: route
      outbound: Available
    # Telegram data centres (apps connect by bare IP, so domain rules never see them).
    - ip_cidr:
        - 91.108.4.0/22
        - 91.108.8.0/22
        - 91.108.12.0/22
        - 91.108.16.0/22
        - 91.108.20.0/22
        - 91.108.56.0/22
        - 149.154.160.0/20
        - 185.76.151.0/24
      action: route
      outbound: Telegram
  domestic_rules:
    # 自建 Emby（Cloudflare 代理，AliDNS 给出的 anycast 地址直连可达）。
    # 两者都不在 emby-domains 名单里，不会被上方的 Emby 规则抢走。
    - domain_suffix: [emby.kingemby.com, media.wybcs.work]
      action: route
      outbound: direct
    - domain_suffix:
        - time.windows.com
        - time.nist.gov
        - ntp.org
        - time.apple.com
        - time.android.com
        - time.google.com
      action: route
      outbound: direct
    - rule_set: [direct-cdn]
      action: route
      outbound: direct
    # Spotify 整条链路（账号/API、图片、音频 CDN）交给 Spotify 分组（默认
    # direct）。DNS 始终走国内解析器，切到代理后仅 CDN 边缘略偏。
    - rule_set: [spotify-direct]
      action: route
      outbound: Spotify
      dns: domestic
    - rule_set: [china-direct]
      action: route
      outbound: direct
    # 中国国家/地区顶级域名不应因 geosite 更新滞后而落入代理。
    # 包括 .cn、.com.cn 以及"中国"的 punycode 表示。
    - domain_suffix: [cn, xn--fiqs8s]
      action: route
      outbound: direct
    - rule_set: [geosite-cn]
      action: route
      outbound: direct
    # 广告拦截放在所有业务与国内直连规则之后：上游广告名单偶尔收录 AI、
    # Emby、Telegram 与应用商店依赖的服务/CDN 主机，前面的规则已先放行它们。
    - rule_set: [geosite-category-ads-all]
      action: reject
    - rule_set: [geosite-geolocation-!cn]
      action: route
      outbound: Available
    - rule_set: [geoip-cn]
      action: route
      outbound: direct
      dns: false
