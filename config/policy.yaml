    - {only: android, tag: google-play, type: group, servers: [google-google-play-v6, cloudflare-google-play-v6, google-google-play-v4,
        cloudflare-google-play-v4]}
    - {tag: domestic, type: group, servers: [alidns, dnspod]}
    - {tag: fakeip-ai, type: fakeip, inet4_range: 198.18.0.0/15}
    # 精确资源、Claude、Play、视频和校时先于宽泛 Google/AI；国内与海外解析器分开。
    rules:
    - {rule_set: block, action: predefined, rcode: NXDOMAIN}
    - {domain: &claude-ipv4-resources [downloads.claude.ai, servd-anthropic-website.b-cdn.net], server: aether-resources}
    - {domain: &public-ai-resources [persistent.oaistatic.com, dl.google.com], server: proxy}
    - {rule_set: [geosite-anthropic, claude], query_type: [HTTPS, SVCB], action: predefined, rcode: NOERROR}
    - {rule_set: [geosite-anthropic, claude], query_type: [A, AAAA], server: fakeip-ai}
    - {rule_set: [geosite-anthropic, claude], server: claude}
    - {only: desktop, rule_set: microsoft-store, server: proxy}
    - {only: android, rule_set: [geosite-google-play, google-play], query_type: [HTTPS, SVCB], action: predefined, rcode: NOERROR}
    - {only: android, rule_set: [geosite-google-play, google-play], query_type: [A, AAAA], server: fakeip-ai}
    - {only: android, rule_set: [geosite-google-play, google-play], server: google-play}
    - domain_suffix:
      - youtube.com
      - youtu.be
      - yt.be
      - youtube-nocookie.com
      - youtubekids.com
      - ytimg.com
      - googlevideo.com
      - youtubei.googleapis.com
      - youtube.googleapis.com
      - yt3.ggpht.com
      - yt4.ggpht.com
      - yt3.googleusercontent.com
      - yt4.googleusercontent.com
      server: youtube
    - {rule_set: geosite-youtube, server: youtube}
    - {rule_set: geosite-twitch, server: twitch}
    - {domain_suffix: [time.google.com], server: domestic}
    - {rule_set: [geosite-google, google], query_type: [HTTPS, SVCB], action: predefined, rcode: NOERROR}
    - {rule_set: [geosite-google, google], query_type: [A, AAAA], server: fakeip-ai}
    - {rule_set: [geosite-google, google], server: google-services}
    - {rule_set: [geosite-openai, ai], query_type: [HTTPS, SVCB], action: predefined, rcode: NOERROR}
    - {rule_set: [geosite-openai, ai], query_type: [A, AAAA], server: fakeip-ai}
    - {rule_set: [geosite-openai, ai], server: ai}
    - {query_type: [AAAA], action: predefined, rcode: NOERROR}
    - {rule_set: emby, server: emby}
    - {rule_set: geosite-telegram, server: telegram}
    - {rule_set: geosite-spotify, server: proxy}
    - {rule_set: proxy, server: proxy}
    - {rule_set: [direct, geosite-private, geosite-cn], server: domestic}
    - {rule_set: geosite-category-ads-all, action: predefined, rcode: NXDOMAIN}
    - {rule_set: geosite-geolocation-!cn, server: proxy}
    - {action: evaluate, server: proxy}
    - {match_response: true, rule_set: geoip-cn, server: domestic}
    - {action: respond}
    final: proxy
    strategy: ipv4_only
    reverse_mapping: true
  # 业务先于国内兜底和通用广告；DNS 与路由共同维护相同的域名优先关系。
  route:
    auto_detect_interface: true
    default_domain_resolver: {server: domestic, timeout: 2s}
    rules:
    - {action: sniff}
    # 端口兜底避免未识别的 TCP/UDP DNS 落到局域网或国内直连。
    - {type: logical, mode: or, rules: [{protocol: dns}, {port: 53}], action: hijack-dns}
    # 在所有业务/私网/国内直连规则前阻断 STUN 与外部 DoT/DoQ。
    # STUN 使用协议识别，覆盖非标准端口；853 同时覆盖 TCP 和 UDP。
    - {protocol: stun, action: reject}
    - {port: 853, action: reject}
    - {rule_set: block, action: reject}
    - {domain: *claude-ipv4-resources, network: udp, port: 443, action: reject}
    - {domain: *claude-ipv4-resources, ip_version: 6, action: reject}
    - {domain: *claude-ipv4-resources, outbound: Aether-US}
    - {domain: *public-ai-resources, network: udp, port: 443, action: reject}
    - {domain: *public-ai-resources, ip_version: 6, action: reject}
    - {domain: *public-ai-resources, outbound: Available}
    - {network: udp, port: 443, rule_set: [geosite-anthropic, claude], action: reject}
    - {network: udp, port: 443, ip_cidr: [160.79.104.0/21, '2607:6bc0::/32'], action: reject}
    - {only: android, package_name: [com.anthropic.claude], network: udp, port: 443, action: reject}
    - {rule_set: [geosite-anthropic, claude], outbound: Claude}
    - {ip_cidr: [160.79.104.0/21, '2607:6bc0::/32'], outbound: Claude}
    - {only: android, package_name: [com.anthropic.claude], outbound: Claude}
