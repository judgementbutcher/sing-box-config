# sing-box 配置策略。
#
# config 一节就是最终的 sing-box 配置（YAML 写法），写什么就生成什么。
# 生成器只额外做三件事：
#   1. 带 only: desktop / only: android 的条目只保留在对应平台；
#   2. 用订阅生成 outbounds（节点 + 下面 groups 描述的分组）；
#   3. 规则里引用到的规则集自动补进 route.rule_set：config/rule-sets 下有
#      同名 .txt 就内嵌，否则按 rule_set_urls 的地址远程下载。
#
# 只想改某个域名的走向，不用动这个文件，往 config/rule-sets 的名单里加一行：
#   direct.txt 直连    proxy.txt 走代理    block.txt 屏蔽

subscription:
  cache_max_age: 3d                    # 下载失败时可用的缓存最长保留时间
  timeout_seconds: 20
  retry_proxy: http://127.0.0.1:7890   # 直连下载失败后，改走本机代理再试一次

groups:
  # AI 分组只收这些地区的节点，顺序即优先级（默认选中第一个地区最靠前的节点）。
  ai_regions: [US, JP, SG, TW]
  # 业务分组：成员是 Available 加各订阅，默认跟随 Available，可在面板单独换节点。
  # direct: first 把直连放在最前并作为默认，direct: last 把直连追加在末尾。
  services:
    - {tag: Emby, direct: last}
    - {tag: YouTube}
    - {tag: Spotify, direct: first}
    - {tag: Telegram}
    - {tag: Twitch}
    - {tag: Google Play, only: android}

rule_set_urls:
  geosite: https://fastly.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/{tag}.srs
  geoip: https://fastly.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/{tag}.srs

config:
  log: {level: warn, timestamp: true}

  experimental:
    cache_file: {enabled: true}        # 记住面板选中的节点，缓存远程规则集
    urltest_unified_delay: true        # reF1nd：测速结果不含建连耗时

  inbounds:
    - only: desktop
      type: tun
      tag: tun-in
      # IPv6 地址只为把 IPv6 流量收进来再由下面的规则拒绝，避免绕过代理。
      address: [172.18.0.1/30, 'fdfe:dcba:9876::1/126']
      auto_route: true
      strict_route: true
    - only: desktop
      type: mixed
      tag: mixed-in
      listen: 127.0.0.1
      listen_port: 7890
    - only: android
      type: tun
      tag: tun-in
      address: [172.18.0.1/30]
      auto_route: true
      # 局域网不进 TUN：手机开着 VPN 也能访问内网设备、拉取本机发布的配置。
      # 172.16.0.0/12 里去掉了 TUN 自己所在的 172.18.0.0/16。
      route_exclude_address:
        - 10.0.0.0/8
        - 172.16.0.0/15
        - 172.19.0.0/16
        - 172.20.0.0/14
        - 172.24.0.0/13
        - 192.168.0.0/16

  dns:
    servers:
      # 国内两路直连 DoH。server 写 IP，省掉"解析器自己要先被解析"。
      # 不要写 detour: direct（核心启动时拒绝），也不要用 type: local
      # （TUN 把系统 DNS 指向自己，local 会查回 sing-box 自己）。
      - {tag: alidns, type: https, server: 223.5.5.5, tls: {server_name: dns.alidns.com}}
      - {tag: dnspod, type: https, server: 1.12.12.12, tls: {server_name: doh.pub}}
      # 海外两路 DoH，经代理出去，拿到的是代理出口附近的 CDN 地址。
      - {tag: google, type: https, server: 8.8.8.8, tls: {server_name: dns.google}, detour: Available}
      - {tag: cloudflare, type: https, server: 1.1.1.1, tls: {server_name: cloudflare-dns.com}, detour: Available}
      # reF1nd 的 group：组内同时查询，先成功的生效。只在同一信任级别内并发，
      # 国内和海外绝不放进同一组（国内解析器对被墙域名又快又假）。
      - {tag: domestic, type: group, servers: [alidns, dnspod]}
      - {tag: proxy, type: group, servers: [google, cloudflare]}
    # DNS 规则与下面的路由规则一一对应：走代理的域名用 proxy 解析，直连的
    # 用 domestic 解析。两边顺序要保持一致。
    rules:
      - {rule_set: block, action: predefined, rcode: NXDOMAIN}
      - only: desktop
        rule_set: microsoft-store
        server: proxy
      - only: android
        rule_set: google-play
        server: proxy
      - rule_set:
          - geosite-youtube
          - geosite-twitch
          - geosite-anthropic
          - geosite-openai
          - ai
          - emby
          - geosite-telegram
          - proxy
          # Spotify 默认直连，但解析放在代理侧：open.spotify.com 在国内
          # 解析器上是被污染的，代理侧答案直连、走代理都能用。
          - spotify
        server: proxy
      - {rule_set: [direct, geosite-cn], server: domestic}
      - {rule_set: geosite-category-ads-all, action: predefined, rcode: NXDOMAIN}
      - {rule_set: geosite-geolocation-!cn, server: proxy}
      # 名单外的域名以代理侧的答案为准：答案在中国大陆 IP 段内，说明是国内
      # 站点，改用国内解析器的答案（CDN 就近，路由层按 geoip-cn 直连）；
      # 否则直接采用代理侧的答案。
      # 不能反过来拿国内解析器的答案做判断：它对被墙域名返回假地址，而且
      # 假地址偶尔也落在大陆 IP 段内（实测 annas-archive.org → 118.184.78.78）。
      # 更不能写成"名单外一律 domestic"——那正是"要挂代理的网站打不开"的成因。
      - {action: evaluate, server: proxy}
      - {match_response: true, rule_set: geoip-cn, server: domestic}
      - {action: respond}
    final: proxy
    strategy: ipv4_only
    # 记下"IP → 域名"，嗅探不出域名的连接也能按域名规则分流。
    reverse_mapping: true

  # 规则集通过代理下载（未指定 http_client 时使用第一个）。
  http_clients:
    - {tag: via-proxy, detour: Available}

  route:
    auto_detect_interface: true
    # 节点域名、直连出站拨号时的域名，都用国内解析器，不依赖任何节点。
    default_domain_resolver: domestic
    rules:
      - {action: sniff}
      - {protocol: dns, action: hijack-dns}
      # mixed 入站收到的是域名：先按上面的 DNS 规则解析成 IP，之后的分流就和
      # TUN 进来的流量完全一样。
      - {only: desktop, inbound: mixed-in, action: resolve}
      - {ip_is_private: true, outbound: direct}
      - {ip_version: 6, action: reject}
      - {protocol: bittorrent, outbound: direct}
      # SSH 直连：多数机场出口封 22 端口，走代理会在握手阶段被断开。
      - {port: 22, outbound: direct}
      - {rule_set: block, action: reject}

      - only: desktop
        process_name: [WinStore.App.exe, MicrosoftStore.exe, StoreExperienceHost.exe]
        outbound: Available
      - only: desktop
        rule_set: microsoft-store
        outbound: Available
      - only: android
        package_name: [com.android.vending, com.google.android.gms, com.google.android.gsf]
        outbound: Google Play
      - only: android
        rule_set: google-play
        outbound: Google Play

      # 业务分组。必须排在 proxy 名单之前：youtubei.googleapis.com、
      # generativelanguage.googleapis.com 等同时命中名单里的 googleapis.com。
      - {rule_set: geosite-youtube, outbound: YouTube}
      - {rule_set: geosite-twitch, outbound: Twitch}
      - {rule_set: [geosite-anthropic, geosite-openai, ai], outbound: AI}
      # Anthropic 自有 IP 段（RDAP: NET-160-79-104-0-1 / ANTHROPIC-V6）兜底。
      # 放在 AI 域名规则正后面：域名没枚举到的（ECH、硬编码 IP、新域名）也能
      # 进 AI 分组，不至于掉到 Available 造成"同一账号两个出口"。
      # IPv6 段不列：上面已有 ip_version 6 → reject。ip_cidr 直接比对连接
      # 目标 IP，sing-box 没有 IP-CIDR 的 no-resolve 字段，写了会启动失败。
      - ip_cidr: ["160.79.104.0/21"]
        outbound: AI
      - {rule_set: emby, outbound: Emby}
      - {rule_set: geosite-telegram, outbound: Telegram}
      # Telegram 数据中心 IPv4（https://core.telegram.org/resources/cidr.txt）
      - ip_cidr:
          - 91.105.192.0/23
          - 91.108.4.0/22
          - 91.108.8.0/22
          - 91.108.12.0/22
          - 91.108.16.0/22
          - 91.108.20.0/22
          - 91.108.56.0/22
          - 149.154.160.0/20
          - 185.76.151.0/24
        outbound: Telegram
      - {rule_set: proxy, outbound: Available}
      - {rule_set: spotify, outbound: Spotify}

      - {rule_set: direct, outbound: direct}
      - {rule_set: geosite-cn, outbound: direct}
      # 广告拦截排在业务与直连名单之后：上游广告名单偶尔会收进它们依赖的主机。
      - {rule_set: geosite-category-ads-all, action: reject}
      - {rule_set: geosite-geolocation-!cn, outbound: Available}
      - {rule_set: geoip-cn, outbound: direct}
    final: Available
