# 配置与分流策略。上游规则在构建阶段完整内嵌，最终配置可独立启动。
subscription: {cache_max_age: 3d, timeout_seconds: 20, retry_proxy: 'http://127.0.0.1:7890'}
# 全部分组手动选择；Claude 严格受信，通用 AI 保留既有豁免。
groups:
  ai_regions: [US, JP, SG, TW]
  services:
  - tag: Claude
    filter: trusted
    default: Aether-US-CHI-v6
    candidates:
    - {source: Aether-US, names: [Aether-US-CHI-v6, Aether-US-SFO-v6, Aether-US-ATL-v6, Aether-US-LAX-v4]}
    - {source: CloudLeadInno-US, names: [CloudLeadInno-US]}
  - tag: Google
    default: AI
    members:
    - AI
    - Available
    - Claude
    - {source: Meow-US, names: [Meow-US-hy2, Meow-US-vless]}
    - {source: Aether-US, names: [Aether-US-LAX-v4, Aether-US-CHI-v6, Aether-US-SFO-v6, Aether-US-ATL-v6]}
    - {source: CloudLeadInno-US, names: [CloudLeadInno-US]}
  - {tag: Aether-前置, outbounds: [Aether-前置-西部数据, Aether-前置-备用]}
  - tag: Aether-前置-西部数据
    filter: aether_transit
    type: selector
    candidates:
    - {source: 西部数据, regions: [HK, JP, TW]}
  - tag: Aether-前置-备用
    filter: aether_transit
    type: selector
    candidates:
    - {source: 羽迹, regions: [HK, JP, TW, SG], names: [台湾1, 台湾2, 台湾3, 日本1, 香港-1, 香港-2, 香港-3, 香港-4, 日本2, 日本3, 日本-东京, 台湾-台南, 新加坡2, 新加坡3]}
  - {tag: Emby, direct: last}
  - {tag: YouTube}
  - {tag: Spotify, direct: first, expand: true}
  - {tag: Telegram}
  - {tag: Twitch}
  - tag: Google Play
    only: android
    default: Available
    members:
    - Available
    - {source: Meow-US, names: [Meow-US-hy2, Meow-US-vless]}
    - {source: Aether-US, names: [Aether-US-LAX-v4, Aether-US-CHI-v6, Aether-US-SFO-v6, Aether-US-ATL-v6]}
    - {source: CloudLeadInno-US, names: [CloudLeadInno-US]}
    - Claude
# 构建下载地址；离线仅复用已校验 release 的规则快照。
rule_set_urls: {geosite: 'https://fastly.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/{tag}.srs', geoip: 'https://fastly.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/{tag}.srs'}
config:
  log: {level: warn, timestamp: true}
  experimental:
    cache_file: {enabled: true, store_fakeip: true, store_dns: true}
    urltest_unified_delay: true
  inbounds:
  - {only: desktop, type: tun, tag: tun-in, address: [172.18.0.1/30, 'fdfe:dcba:9876::1/126'], auto_route: true, strict_route: true}
  - {only: desktop, type: mixed, tag: mixed-in, listen: 127.0.0.1, listen_port: 7890}
  - only: android
    type: tun
    tag: tun-in
    address: [172.18.0.1/30, 'fdfe:dcba:9876::1/126']
    mtu: 1400
    auto_route: true
    strict_route: true
  # Fake-IP 保留业务域名；真实解析和非地址查询跟随对应业务分组。
  dns:
    optimistic: {enabled: true, timeout: 1m}
    timeout: 3s
    servers:
    - tag: alidns
      type: https
      server: 223.5.5.5
      tls: {server_name: dns.alidns.com}
    - tag: dnspod
      type: https
      server: 1.12.12.12
      tls: {server_name: doh.pub}
    - tag: google-proxy-v6
      type: https
      server: 2001:4860:4860::8888
      tls: {server_name: dns.google}
      detour: Available
    - tag: cloudflare-proxy-v6
      type: https
      server: 2606:4700:4700::1111
      tls: {server_name: cloudflare-dns.com}
      detour: Available
    - tag: google-proxy-v4
      type: https
      server: 8.8.8.8
      tls: {server_name: dns.google}
      detour: Available
    - tag: cloudflare-proxy-v4
      type: https
      server: 1.1.1.1
      tls: {server_name: cloudflare-dns.com}
      detour: Available
    - {tag: proxy, type: group, servers: [google-proxy-v6, cloudflare-proxy-v6, google-proxy-v4, cloudflare-proxy-v4]}
    # Claude 的资源跟随 Aether-US 手动分组；DNS 与连接使用同一出口，提供双栈 DoH。
    - tag: google-aether-resources-v6
      type: https
      server: 2001:4860:4860::8888
      tls: {server_name: dns.google}
      detour: Aether-US
    - tag: cloudflare-aether-resources-v6
      type: https
      server: 2606:4700:4700::1111
      tls: {server_name: cloudflare-dns.com}
      detour: Aether-US
    - tag: google-aether-resources-v4
      type: https
      server: 8.8.8.8
      tls: {server_name: dns.google}
      detour: Aether-US
    - tag: cloudflare-aether-resources-v4
      type: https
      server: 1.1.1.1
      tls: {server_name: cloudflare-dns.com}
      detour: Aether-US
    - {tag: aether-resources, type: group, servers: [google-aether-resources-v6, cloudflare-aether-resources-v6, google-aether-resources-v4,
        cloudflare-aether-resources-v4]}
    - tag: google-claude-v6
      type: https
      server: 2001:4860:4860::8888
      tls: {server_name: dns.google}
      detour: Claude
    - tag: cloudflare-claude-v6
